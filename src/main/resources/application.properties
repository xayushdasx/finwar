spring.application.name=finwar

# Database connection. Credentials come from environment variables; nothing secret lives in this file.
# See application.properties.example and the README for setup.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finwar?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# "update" lets Hibernate create the tables from the JPA entities on first run.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
